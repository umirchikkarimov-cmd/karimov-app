<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.Karimov Ta'lim Platformasi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #070913;
            color: #ffffff;
            padding-top: 70px;
            padding-bottom: 80px;
            display: flex;
            justify-content: center;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #0d0f1d;
            border-bottom: 1px solid #1a1e36;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: #a855f7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .brand-text h1 {
            font-size: 14px;
            font-weight: 700;
        }

        .brand-text p {
            font-size: 10px;
            color: #64748b;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .xp-pill {
            background: #1e1b4b;
            color: #fbbf24;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #312e81;
        }

        .role-pill {
            background: #1e293b;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Banner */
        .hero-card {
            background: linear-gradient(180deg, #2e1065 0%, #170d35 100%);
            border: 1px solid #4c1d95;
            border-radius: 18px;
            padding: 20px;
            position: relative;
        }

        .hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge-purple {
            background: #4c1d95;
            color: #c084fc;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .hero-date {
            font-size: 11px;
            color: #94a3b8;
        }

        .hero-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .hero-title span {
            color: #f472b6;
        }

        .hero-desc {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .hero-btns {
            display: flex;
            gap: 8px;
        }

        .btn-purple {
            flex: 1;
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
