<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.Karimov Ta'lim Platformasi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #080911;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 1-BOSQICH: LOGIN EKRANI */
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-self: center;
        }

        .login-card {
            background: #121526;
            border: 1px solid #20253e;
            border-radius: 20px;
            padding: 36px 28px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .login-card h2 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .login-card p {
            color: #8b9bb4;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: #090b16;
            border: 1px solid #232943;
            color: #fff;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
            margin-top: 10px;
        }

        /* 2-BOSQICH: DASHBOARD */
        .dashboard-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            padding-top: 70px;
            padding-bottom: 90px;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #0d0f1c;
            border-bottom: 1px solid #1c2138;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .brand-text h1 {
            font-size: 14px;
            font-weight: 800;
        }

        .brand-text p {
            font-size: 10px;
            color: #64748b;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .xp-pill {
            background: #1c1936;
            color: #fbbf24;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #322b61;
        }

        .role-pill {
            background: #1a2035;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #283250;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            padding: 0 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Banner */
        .hero-card {
            background: linear-gradient(180deg, #2a1147 0%, #150d2e 100%);
            border: 1px solid #431a75;
            border-radius: 20px;
            padding: 22px 20px;
        }

        .hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .badge-purple {
            background: #431a75;
            color: #d8b4fe;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .hero-date {
            font-size: 11px;
            color: #94a3b8;
        }

        .hero-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #ffffff;
        }

        .hero-title span {
            color: #f472b6;
        }

        .hero-desc {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .hero-btns {
            display: flex;
            gap: 10px;
        }

        .btn-purple {
            flex: 1;
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn-outline {
            flex: 1;
            background: #111a2e;
            color: #38bdf8;
            border: 1px solid #1e2d4a;
            padding: 11px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* PIN Panel */
        .pin-panel {
            background: #121526;
            border: 1px solid #20253e;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pin-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pin-icon {
            background: #1d173b;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c084fc;
            font-size: 16px;
        }

        .pin-text h3 {
            font-size: 12px;
            font-weight: 700;
        }

        .pin-text p {
            font-size: 10px;
            color: #64748b;
            margin-top: 1px;
        }

        .pin-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #090b16;
            border: 1px solid #20253e;
            padding: 4px 6px;
            border-radius: 10px;
        }

        .pin-input {
            width: 65px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }

        .btn-pin {
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: #121526;
            border: 1px solid #20253e;
            border-radius: 16px;
            padding: 14px;
        }

        .stat-title {
            font-size: 9px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-sub {
            font-size: 10px;
            color: #34d399;
            font-weight: 600;
        }

        .stat-sub-gray {
            font-size: 10px;
            color: #64748b;
        }

        /* Exam Section Header */
        .section-header {
            margin-top: 6px;
        }

        .section-header h3 {
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header p {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Exam Card */
        .exam-card {
            background: #121526;
            border: 1px solid #20253e;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exam-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .tag {
            background: #3b136b;
            color: #d8b4fe;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .tag-blue {
            background: #0f3854;
            color: #38bdf8;
        }

        .pin-lbl {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
        }

        .exam-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .exam-meta {
            font-size: 11px;
            color: #64748b;
        }

        .btn-start
